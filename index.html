<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>On-Screen Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="javascript.js" defer></script>
</head>
<body>
  <div class="calculator">
    <!-- Display -->
    <div class="display">0</div>

    <!-- Buttons Container -->
    <div class="buttons">
      <!-- Top Row: Utility & Clear -->
      <div class="row">
        <button class="AC">AC</button>
        <button class="Delete">DEL</button>
        <button class="Point">.</button>
      </div>

      <!-- Main Section: Operands & Operators -->
      <div class="main-buttons">
        <!-- Operands Group (0-9) -->
        <div class="operands">
          <button class="seven" data-value="7">7</button>
          <button class="eight" data-value="8">8</button>
          <button class="nine" data-value="9">9</button>
          <button class="four" data-value="4">4</button>
          <button class="five" data-value="5">5</button>
          <button class="six" data-value="6">6</button>
          <button class="one" data-value="1">1</button>
          <button class="two" data-value="2">2</button>
          <button class="three" data-value="3">3</button>
          <button class="zero" data-value="0">0</button>
        </div>

        <!-- Operators Group (+, -, *, /) -->
        <div class="operators">
          <button class="Divide op" data-value="/">/</button>
          <button class="Multiply op" data-value="*">*</button>
          <button class="Subtract op" data-value="-">-</button>
          <button class="Add op" data-value="+">+</button>
        </div>
      </div>

      <!-- Separate Equal Button Container -->
      <div class="equal-container">
        <button class="Equal" data-value="=">=</button>
      </div>
    </div>
  </div>
</body>
</html>
